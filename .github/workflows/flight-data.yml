name: Flugdaten holen

# Zwei Betriebsarten:
#  - Dauerlauf (workflow_dispatch): ein Auftrag läuft mehrere Stunden und fragt
#    im Takt ab. Verlässlich, weil er nicht auf den GitHub-Zeitplan angewiesen
#    ist – der verschluckt Fünf-Minuten-Crons unter Last regelmäßig.
#  - Zeitplan: als Rückfallebene, wenn kein Dauerlauf aktiv ist.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Laufzeit in Minuten (max. 330)'
        required: false
        default: '180'
      interval:
        description: 'Abstand zwischen den Abfragen in Sekunden'
        required: false
        default: '300'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: flight-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ek050-flight-tracker-widget-ourg9m

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abfragen und sichern
        env:
          MINUTES: ${{ github.event.inputs.minutes || '0' }}
          INTERVAL: ${{ github.event.inputs.interval || '300' }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ENDE=$(( $(date +%s) + MINUTES * 60 ))

          while true; do
            node tools/fetch-flight.js || echo "Abruf fehlgeschlagen, weiter im Takt"

            if [ -n "$(git status --porcelain data/)" ]; then
              git add data/
              git commit -m "Flugdaten $(date -u '+%Y-%m-%d %H:%MZ')"
              # Zwischenzeitliche Änderungen am Zweig übernehmen, dann schieben
              git pull --rebase --autostash origin claude/ek050-flight-tracker-widget-ourg9m || true
              git push origin HEAD:claude/ek050-flight-tracker-widget-ourg9m || echo "Push verschoben"
            else
              echo "Keine Änderung an den Flugdaten."
            fi

            # Einzellauf (Zeitplan) endet hier
            [ "$(date +%s)" -ge "$ENDE" ] && break
            sleep "$INTERVAL"
          done
